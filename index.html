<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>群雄割拠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9dd;--paper:#fffdf8;--ink:#2a2622;--sub:#6e655b;--line:#d8cfc0;--sea:#c9dbe3;--land:#efe6d2;--neu2:#d9cdb4;--acc:#8a2b2b;--good:#1e7b46;--bad:#b03030;--tick:#2a2622;--tickfg:#f2ece0;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--paper:#262320;--ink:#ece4d6;--sub:#b0a594;--line:#3e3830;--sea:#1f3440;--land:#4a443a;--neu2:#5a5040;--acc:#e07070;--good:#5cc387;--bad:#ef7b7b;--tick:#0e0d0c;}}
:root[data-theme="dark"]{--bg:#1c1a18;--paper:#262320;--ink:#ece4d6;--sub:#b0a594;--line:#3e3830;--sea:#1f3440;--land:#4a443a;--neu2:#5a5040;--acc:#e07070;--good:#5cc387;--bad:#ef7b7b;--tick:#0e0d0c;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","BIZ UDPゴシック",sans-serif;font-size:15px;line-height:1.6;display:flex;flex-direction:column}
button,select,input{font-family:inherit;font-size:inherit}
#ticker{flex:none;background:var(--tick);color:var(--tickfg);height:28px;overflow:hidden;white-space:nowrap;position:relative;font-size:13px}
#ticker .lab{position:absolute;left:0;top:0;bottom:0;z-index:2;background:var(--acc);color:#fff;padding:0 10px;line-height:28px;font-weight:700}
#ticker .run{display:inline-block;padding-left:100%;line-height:28px;animation:run 70s linear infinite}
#ticker .run span{margin-right:44px}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#app{flex:1;min-height:0}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%;margin-top:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hint{font-size:12px;color:var(--sub)}
.game{display:grid;grid-template-columns:minmax(0,1fr) calc(340px * var(--ui));height:100%}
/* ---- 画面の大きさに合わせた表示（--ui は画面から自動で決まる倍率） ---- */
:root{--ui:1}
#panel,#ticker,.mmode,.legend,#endBtn,.title,.result{zoom:var(--ui)}
.zm>*{zoom:var(--ui)}
#dlgBox{zoom:var(--ui);max-height:calc(90vh / var(--ui))}
#tip:not(.rich){font-size:calc(13px * var(--ui))!important;max-width:calc(240px * var(--ui))!important}#tip.rich{zoom:var(--ui)}
.result{height:calc((100% - 32px) / var(--ui))!important}
.legend .lgt{display:none;font-weight:700;cursor:pointer}
html[data-ui=xs] .legend,html[data-ui=s] .legend{cursor:pointer}
html[data-ui=xs] .legend .lgt,html[data-ui=s] .legend .lgt{display:inline}
html[data-ui=xs] .legend:not(.open) .lgc,html[data-ui=s] .legend:not(.open) .lgc{display:none}
html[data-ui=xs] .legend.open .lgt,html[data-ui=s] .legend.open .lgt{display:none}
html[data-ui=xs] .game{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,58fr) minmax(0,42fr);height:100%}
html[data-ui=xs] #panel{border-left:none;border-top:2px solid var(--line)}
html[data-ui=xs] #endBtn{zoom:calc(var(--ui) * 0.72)}html[data-ui=xs] #endBtn .ebox{display:none}
html[data-ui=xs] #dipLeg{display:none}
html[data-ui=xs] .zm{gap:4px}html[data-ui=xs] .zm>*{zoom:calc(var(--ui) * 0.82)}
html[data-ui=xs] .title{margin:10px;padding:14px}
/* 立体の地図の地名・札（位置はそのまま、中身だけ大きさを変える） */
.k3>*,.t3u>*{zoom:var(--ui)}
.t3n{font-size:calc(10.5px * var(--ui))!important}
.mapw{position:relative;min-height:0;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}
.area{stroke:#5b5146;stroke-width:.7;cursor:pointer;transition:fill .3s}
.area.mine{stroke:#2a2622;stroke-width:1.4}
.area.hl{}
.area:hover{filter:brightness(1.08)}
.lab{font-size:10px;text-anchor:middle;fill:#2a2622;pointer-events:none;paint-order:stroke;stroke:#fff8;stroke-width:3px}
.kic{font-size:10px;text-anchor:middle;fill:#2a2622;pointer-events:none}
.npc{fill:#8a8580;stroke:#fff;stroke-width:1.2}.npc.ikki{fill:#6b4b3a}
.npct{font-size:10px;fill:#fff;text-anchor:middle;font-weight:700}
.arw{pointer-events:none}
.legend{position:absolute;left:8px;bottom:6px;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.npcl{display:inline-block;width:10px;height:10px;background:#8a8580;margin-right:3px;vertical-align:-1px}
#panel{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px}
.card h3{margin:0 0 6px;font-size:14px;color:var(--acc)}
.card.warn{border-color:var(--bad)}
.hh{display:flex;gap:10px;align-items:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.dot.big{width:38px;height:38px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.goal{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}.goal.done{color:var(--good)}
.ol{margin:6px 0;padding-left:18px;font-size:13px}
.pols{display:flex;flex-direction:column;gap:4px}.pol{text-align:left}.pol small{display:block;color:var(--sub);font-size:11px}.pol.done{border-color:var(--good)}
.rels{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0;font-size:12px}
.rl{border:1px solid var(--line);border-radius:10px;padding:0 7px}.rl.domei{border-color:var(--good);color:var(--good)}.rl.fusen{border-color:#3d6fb4;color:#3d6fb4}.rl.teki{border-color:var(--bad);color:var(--bad)}
.inbox{border:1px solid #e8b400;border-radius:6px;padding:6px;margin-bottom:6px;font-size:13px}
.logs{font-size:12px;max-height:150px;overflow:auto}
.up{color:var(--good)}.dn{color:var(--bad)}
#dlg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#dlg.on{display:flex}
#dlgBox{background:var(--paper);color:var(--ink);border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px}
#dlgBox h3{margin:4px 0 8px;color:var(--acc)}
#dlgBox label{display:block;margin:8px 0}
#dlgBox select,#dlgBox input[type=text]{padding:5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);max-width:100%}
#dlgBox input[type=text]{width:100%}
.lt{font-size:14px;margin:3px 0!important}
.reply{margin-top:8px;padding:8px;border-radius:6px;border:1px solid var(--line)}.reply.ok{border-color:var(--good)}.reply.ng{border-color:var(--bad)}
.yr{font-size:28px;font-weight:700;color:var(--acc)}
.steps{font-size:13px;background:var(--bg);border-radius:6px;padding:6px 10px;margin:8px 0}
.warn{color:var(--bad)}
#tip{position:fixed;z-index:30;background:linear-gradient(170deg,#2b2017,#16110d);color:#f3e6c8;border:1px solid #c9a45c;box-shadow:0 8px 20px #0009,inset 0 0 0 2px #1a130e;font-size:13px;padding:7px 11px;border-radius:4px;max-width:240px;pointer-events:none;display:none}
.title{max-width:720px;margin:30px auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}
.title h2{font-size:40px;margin:0;color:var(--acc);letter-spacing:.2em}
.q{font-weight:700;border-left:4px solid var(--acc);padding-left:8px}
.result{max-width:1000px;margin:16px auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;overflow:auto;height:calc(100% - 32px)}
.result h2{margin:2px 0 6px;color:var(--acc)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
.chart{width:100%;color:var(--ink)}
.small{font-size:13px}
.tl{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);font-size:13px}.tl>div{padding:6px 8px;border-bottom:1px solid var(--line)}.tl .h{font-weight:700;background:var(--bg)}
.hist{font-size:13px;columns:2}@media(max-width:700px){.hist{columns:1}}
.rank{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}.rank .me{font-weight:700;color:var(--acc)}

.area.mt{}
.area.selA{}
.rd{stroke-linecap:round;pointer-events:none}
.rd.main{stroke:#8a5a2b;stroke-width:1.8;opacity:.75}
.rd.mtn{stroke:#8a7a60;stroke-width:.8;stroke-dasharray:2 2;opacity:.6}
.rd.sea{stroke:#2c6aa0;stroke-width:1.2;stroke-dasharray:4 3;opacity:.7}
#map.far .lab{display:none}#map.far .ty,#map.far .tyk,#map.far .tyn{display:none}
.lab{font-size:7px}.kic{font-size:7px}.kic.honjo{font-size:10px;font-weight:700}
.unit{cursor:pointer}
.uk{font-size:9px;font-weight:700;text-anchor:middle;fill:#fff;pointer-events:none;paint-order:stroke;stroke:#0007;stroke-width:1.6px}
.unit circle{stroke:#fff;stroke-width:1.2}.unit.me>circle:first-child{stroke:#111;stroke-width:1.8}.unit.sel>circle:first-child{stroke:#e8b400;stroke-width:3}
.ty{stroke:#333!important;stroke-width:.5!important}.ty.ashi{fill:#f3e3b5}.ty.kiba{fill:#f1b6a6}.ty.yumi{fill:#bfe0b8}.ty.teppo{fill:#b9c6e8}
.tyk{font-size:4.4px;text-anchor:middle;fill:#222;pointer-events:none;font-weight:700}
.tyn{font-size:4.6px;text-anchor:middle;fill:#111;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:1.4px;font-weight:700}
.cnt{font-size:6px;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:1.5px}
.zm{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.zb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:26px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px #0003;line-height:1}
.zb.t{font-size:12px}
.zb:hover{border-color:var(--acc)}
.lr{display:inline-block;width:16px;height:4px;background:#e6dbbd;border:1px solid #4a3a26;border-radius:2px;vertical-align:2px;margin-left:6px}.lr.mtn{height:2px;background:#e9e0cc;border-color:#4a3a2699}.lr.sea{height:0;background:none;border:none;border-top:2px dashed #2c6aa0}
.army{border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin:6px 0;cursor:pointer;font-size:13px}.army.on{border-color:#e8b400;box-shadow:0 0 0 2px #e8b40055}
.chips{display:flex;gap:4px;margin:4px 0}.chip{border-radius:10px;padding:0 7px;font-size:12px;border:1px solid #0002}
.chip.ashi{background:#f3e3b5;color:#222}.chip.kiba{background:#f1b6a6;color:#222}.chip.yumi{background:#bfe0b8;color:#222}.chip.teppo{background:#b9c6e8;color:#222}
.rec{margin-top:6px}.rec .btn{margin:2px}
.mini{font-size:12px;padding:3px 4px;border-bottom:1px dashed var(--line);cursor:pointer}.mini:hover{background:var(--bg)}
.warnb{color:#b07a00;font-weight:700}
.bt{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;font-size:13px}.bt.win{border-color:var(--good)}.bt.lose{border-color:var(--bad)}
.btt{width:100%;border-collapse:collapse;margin-top:4px}.btt td,.btt th{border-bottom:1px solid var(--line);padding:2px 4px;text-align:left;font-size:12px}
select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}

.game{grid-template-columns:1fr 370px}
.gbox{stroke-width:1.6}
.unit.me .gbox{stroke-width:2.2}.unit.sel .gbox{stroke:#e8b400!important;stroke-width:2.8}
.mc{stroke:#0006;stroke-width:.3}.mc.ashi{fill:#f3e3b5}.mc.kiba{fill:#f1b6a6}.mc.yumi{fill:#bfe0b8}.mc.teppo{fill:#b9c6e8}
.mck{font-size:2.9px;text-anchor:middle;fill:#222;font-weight:700;pointer-events:none}
#map.far .mc,#map.far .mck{display:none}
.gen{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#2a2622;border:2px solid var(--hc);color:#fff;font-weight:700;font-size:13px;vertical-align:middle;flex:none}
.gen.big{width:40px;height:40px;font-size:21px;border-radius:10px;border-width:3px}
.hk{font-size:4.6px;text-anchor:middle;fill:#fff;font-weight:700;pointer-events:none}
.gen{position:relative}.gen .hb{position:absolute;left:-6px;top:-6px;width:14px;height:14px;border-radius:50%;background:var(--hc);color:#fff;font-size:8px;font-style:normal;line-height:14px;text-align:center;border:1px solid #fff}
.gen.big .hb{width:18px;height:18px;line-height:18px;font-size:11px}
.ubadge{fill:#fff;stroke:#2a2622;stroke-width:.9}.ubn{font-size:7px;font-weight:700;text-anchor:middle;fill:#2a2622;pointer-events:none}
.mmode{position:absolute;left:8px;top:8px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;max-width:70%}
.mmode span span{margin-right:6px;white-space:nowrap}.mmode i,.dleg i,.drow i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.dleg{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-bottom:4px}
.drow{display:flex;align-items:center;gap:5px;font-size:13px;padding:2px 3px;border-radius:5px;cursor:pointer}.drow:hover{background:var(--bg)}.drow .hint{margin-left:auto}
.drow:not(.nb){opacity:.75}
.dh{display:inline-flex;width:18px;height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
.dipl{max-height:260px;overflow:auto}
.btn.wide2{width:100%;margin-top:8px}
.kic.honjo{font-size:11px;font-weight:700;fill:#8a1f1f}
.ahead{display:flex;gap:8px;align-items:center}
.ucards{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ucard{position:relative;width:52px;border:1px solid #0003;border-radius:6px;padding:3px 3px 2px;text-align:center;cursor:pointer;color:#222;font-size:10px;line-height:1.25;user-select:none}
.ucard.ashi{background:#f3e3b5}.ucard.kiba{background:#f1b6a6}.ucard.yumi{background:#bfe0b8}.ucard.teppo{background:#b9c6e8}
.ucard.sel{outline:3px solid #e8b400;outline-offset:-1px}
.ucard .uk2{font-size:18px;font-weight:700;line-height:1.1}
.ucard .un{font-size:9px}
.ubar{height:5px;background:#0002;border-radius:3px;margin:2px 0;overflow:hidden}.ubar i{display:block;height:100%;background:#2a2622}
.ust{color:#9a6a00;font-size:8px;letter-spacing:-1px}
.cross{position:absolute;right:-5px;top:-6px;width:15px;height:15px;border-radius:50%;background:#2e9e44;color:#fff;font-size:10px;line-height:15px;text-align:center;border:1px solid #fff}
.refl{color:#2e9e44;font-weight:700}

/* 表示の細かさ（ズーム） */
.realm{font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fffc;stroke-width:3px;opacity:.85;font-family:"BIZ UDPMincho","BIZ UDPGothic",serif}
.realm.me{opacity:.95}
#map.near .realm{display:none}#map.mid .realm{opacity:.55}
.kicon .kbg{fill:#fffdf6;stroke:#5b4a36;stroke-width:1}.kicon .kbg.main{fill:#fff3d6;stroke:#8a1f1f;stroke-width:1.6}
.kuse{fill:#4a3a2a}.kuse.k京{fill:#b0861a}.kuse.k堺{fill:#8a6a10}.kuse.k寺{fill:#7a3a3a}.kuse.k港{fill:#1f5a8a}.kuse.k銀{fill:#5a5a5a}
.kicon .lab{font-size:9px;text-anchor:middle;fill:#2a2622;paint-order:stroke;stroke:#fffe;stroke-width:3px;pointer-events:none}
.kicon .lab.mainlab{font-weight:700;font-size:10px}
.kicon{pointer-events:none}
#map.far .kicon:not(.main),#map.far .kicon .lab{display:none}
#map.far .kicon.main .kbg{opacity:.85}
#map.mid .kicon:not(.main):not(.sp){display:none}#map.mid .kicon:not(.main) .lab{display:none}
#map.far .rd.mtn,#map.mid .rd.mtn{display:none}#map.far .rd.sea{display:none}#map.far .rd.main{stroke-width:1.2;opacity:.45}
.unit .ring{opacity:.95}.unit.sel .ring{fill:#e8b400!important}
.uk{font-size:12px!important}.hk{font-size:6px!important}.ubn{font-size:8.5px!important}
.lgi{width:14px;height:14px;vertical-align:-2px;margin:0 2px 0 6px;fill:#4a3a2a}
.sech{font-size:13px;font-weight:700;margin:8px 0 2px;color:var(--acc)}
.rcard{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:84px}
.rcard.dis{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.rcard .ucost{font-size:11px;font-weight:700}.uplus{font-size:9px;font-weight:700;color:#1e5a2e;background:#fff8;border-radius:4px;padding:0 3px;margin-top:2px}
.rcard:not(.dis):hover,.bcard:hover{transform:translateY(-2px);box-shadow:0 2px 5px #0003}
.bcard{background:#efe3c8;display:flex;flex-direction:column;align-items:center;min-height:84px}
.bcard .gen{width:28px;height:28px;font-size:15px}.bn2{font-size:9px;line-height:1.2;min-height:22px}
.area{stroke:#3a2a1a;stroke-width:.5;stroke-opacity:.55}
.area.mine{stroke:#1d3a8a;stroke-width:1.2;stroke-opacity:.9}
.area:hover{filter:none;fill-opacity:.6!important}
.area.hl{filter:none}
.area.selA{filter:none}
#gSel .sg{animation:sglow 2.6s ease-in-out infinite}#gSel .sg.reach{animation-duration:3.2s}
@keyframes sglow{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#gSel .sg{animation:none}}
/* 街道は砂利道の色：明るい土色に暗いふち */
.rd.main{stroke:#e6dbbd;stroke-width:1.6;opacity:1}.rd.cas.main{stroke:#4a3a26;stroke-width:3;opacity:.7}
.rd.mtn{stroke:#e9e0cc;stroke-width:.9;opacity:.95}.rd.cas.mtn{stroke:#4a3a26;stroke-width:1.8;stroke-dasharray:none;opacity:.35}
#map.far .rd.main{stroke-width:1.1;opacity:.85}#map.far .rd.cas.main{stroke-width:2;opacity:.5}
.realm{stroke:#fff8f0}
.area{stroke:#1a2a10;stroke-opacity:.45}
.kicon .lab{stroke:#fffd}
.rb{fill:none;stroke-width:1.1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.8;pointer-events:none}
.rb.me{stroke-width:1.8px}
#map.ter .rb{stroke-width:1px;opacity:.7}
#map.ter .area{stroke-opacity:.25}
.next{border-left:5px solid #e8b400;background:color-mix(in srgb,#e8b400 12%,var(--paper));border-radius:6px;padding:8px 10px;margin:8px 0;font-size:13px}
.next b{font-size:15px;display:block;margin-bottom:2px}.next.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--paper))}
.next.mv{border-color:#2c5aa0;background:color-mix(in srgb,#2c5aa0 12%,var(--paper))}.next .btn{margin-top:6px}
.amenu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.abtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:68px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer;font-family:inherit;padding:6px}
.abtn .aic{font-size:22px;line-height:1}.abtn b{font-size:15px}.abtn small{font-size:11px;color:var(--sub)}
.abtn:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}

.ucard{--uc:#b98b4e;background:linear-gradient(180deg,#2c2117,#18110b)!important;border:1px solid #8a6a2f!important;border-top:4px solid var(--uc)!important;color:var(--ink)!important;border-radius:4px!important;box-shadow:0 2px 5px #0008}
.ucard.ashi{--uc:#c99a55}.ucard.kiba{--uc:#c9473a}.ucard.yumi{--uc:#5f9a4a}.ucard.teppo{--uc:#5577b8}
.ucard .uk2{color:var(--uc);text-shadow:0 1px 0 #000}.ucard .un{color:var(--sub)}.ucard .unum{color:var(--ink)}
.ucard .ubar{background:#00000080;height:4px}.ucard .ubar i{background:linear-gradient(90deg,var(--uc),color-mix(in srgb,var(--uc) 60%,#fff))!important}
.ucard .ust{color:var(--gold2)}
.ucard.sel{outline:2px solid var(--gold2)!important;box-shadow:0 0 10px #e2b45a88}
.cross{background:#3f7a46!important;border:1px solid var(--gold2)!important;box-shadow:0 0 6px #6fd48a88}
.rcard .ucost{color:var(--gold2)}.uplus{background:#3f7a46!important;color:#fff3d6!important}
.rcard.dis .uplus{background:#5a4a3a!important}
.bcard{--uc:#8a6a2f;border-top-color:var(--gold)!important}.bcard .ubar i{background:linear-gradient(90deg,#8a6a2f,#e2c27a)!important}
.bcard .uplus{background:#6c3f86!important}
.sech{border-bottom:1px solid #8a6a2f66;padding-bottom:2px}
/* 部隊のカードは4列×3行（最大12部隊） */
/* 画面がせまく右の欄が下にまわったときも、部隊の絵が大きくなりすぎないように（1枚の幅は100pxまで） */
.ucards{display:grid!important;grid-template-columns:repeat(4,minmax(0,100px));justify-content:start;gap:5px!important}
.ucards .ucard{width:auto!important;min-width:0}
.ucards .ucard .uk2{font-size:20px}.ucards .ucard .un{font-size:10px}.ucards .ucard .unum{font-size:11px}
/* 部隊の絵 */
.upic{align-self:stretch;width:auto;position:relative;height:54px;margin:-1px -1px 2px;border-radius:2px;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--uc,#c99a55) 35%,#2a1f15),#140e09 75%) ;background-size:cover;background-position:center top}
.upic{background-image:none}
.upic[style]{background-color:#1d150e;background-blend-mode:normal;background-size:118% auto;background-repeat:no-repeat;background-position:50% 12%}
.upic .uk2,.upic .bk{position:absolute;left:2px;top:1px;font-size:13px!important;line-height:1;padding:2px 3px;border-radius:3px;background:#140e09cc;color:var(--uc)!important;box-shadow:0 0 0 1px var(--uc);font-weight:700}
.ucard .upic{box-shadow:inset 0 -14px 12px -8px #18110b}
.bvc{--uc:#c99a55}.bvc.kiba{--uc:#c9473a}.bvc.yumi{--uc:#5f9a4a}.bvc.teppo{--uc:#5577b8}
.bvc .upic{height:42px}
.rcard.dis .upic{filter:grayscale(1)}
.ucard.dead .upic,.bvc.dead .upic{filter:grayscale(1) brightness(.6)}
#toast{position:fixed;left:50%;top:44px;transform:translate(-50%,-10px);z-index:40;padding:8px 18px;border-radius:4px;background:linear-gradient(#2a1f15f2,#140e09f2);border:1px solid var(--gold);color:var(--ink);font-family:"BIZ UDPMincho","BIZ UDPGothic",serif;font-size:15px;box-shadow:0 6px 16px #000a;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:#c0574a;color:#ffd9d3}
#endBtn .etimer{display:flex;align-items:center;gap:6px;margin:2px 0 4px;font-size:12px;color:var(--sub)}
#endBtn .etimer b{font-size:20px;color:#fff3d6;font-variant-numeric:tabular-nums;min-width:48px}
#endBtn .etb{flex:1;height:6px;border-radius:3px;background:#00000080;overflow:hidden;box-shadow:inset 0 0 0 1px #6b5430}#endBtn .etb i{display:block;height:100%;background:linear-gradient(90deg,#e2c27a,#f3d98f);transition:width .25s linear}
#endBtn .etimer.low b{color:#ff8a7a;animation:tlow 1s steps(2) infinite}#endBtn .etimer.low .etb i{background:#d0473f}
@keyframes tlow{50%{opacity:.4}}
/* 画面上のタブの帯 */
#app:has(.topbar){display:flex;flex-direction:column}#app>.game{flex:1;min-height:0;height:auto}
.topbar{flex:none;display:flex;align-items:stretch;gap:2px;padding:0 8px;height:calc(40px * var(--ui));background:linear-gradient(#211810,#120d09);border-bottom:1px solid var(--gold);box-shadow:0 2px 8px #0008;z-index:5;font-family:"BIZ UDPMincho","BIZ UDPGothic",serif}
.topbar>*{zoom:var(--ui)}
.ttab{position:relative;display:flex;align-items:center;gap:6px;padding:0 16px;height:40px;font-family:inherit;font-size:15px;color:var(--ink);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;letter-spacing:.08em}
.ttab:hover{color:#fff;background:#e2b45a14}
.ttab.on{color:var(--gold2);border-bottom-color:var(--gold2);background:linear-gradient(transparent,#e2b45a22)}
.tti{display:flex;width:18px;height:18px;color:var(--gold)}.tti svg{width:100%;height:100%}
.ttb{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:#b8402f;color:#fff3d6;font-size:11px;line-height:18px;text-align:center;padding:0 4px;box-shadow:0 0 0 1px var(--gold2)}
.tsum{margin-left:14px;padding-left:16px;border-left:1px solid #c9a24a66;display:flex;align-items:center;gap:18px;font-size:13px;color:#d8c49a;height:28px;white-space:nowrap}
.tsum>span{display:flex;align-items:center;gap:5px}.tsum b{color:var(--gold2);font-size:17px;font-family:"BIZ UDPMincho",serif}
.tsum .ti{width:20px;height:20px;flex:none}.tsum .tsk .ti{color:#e8c65a}.tsum .tsg .ti{color:#f0c437}.tsum .tsh .ti{color:#d9a089}
html[data-ui=xs] .tsum{display:none}html[data-ui=xs] .ttab{padding:0 8px;font-size:13px}
.pol{display:block;text-align:left}.pold{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
/* 届いた書状の知らせ */
.tmail{display:flex;align-items:center;gap:8px;margin:5px 0 5px 12px;padding:0 12px 0 6px;font-family:inherit;font-size:13px;color:#fff3d6;cursor:pointer;border:1px solid var(--gold2);border-radius:15px;background:linear-gradient(#8e2a1e,#5a160e);box-shadow:0 0 10px #e2b45a66;animation:mailGlow 1.6s ease-in-out infinite}
.tmail b{color:var(--gold2);font-size:15px;margin:0 2px}
.tmi{position:relative;display:flex;width:26px;height:20px}.tmi svg{width:100%;height:100%;animation:mailBob 1.6s ease-in-out infinite}
.tmi i{position:absolute;right:-7px;top:-6px;min-width:16px;height:16px;border-radius:8px;background:#e2c27a;color:#2a1a0e;font-style:normal;font-size:11px;font-weight:700;line-height:16px;text-align:center;padding:0 3px}
@keyframes mailGlow{0%,100%{box-shadow:0 0 6px #e2b45a55}50%{box-shadow:0 0 16px #f3d98fcc}}
@keyframes mailBob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
html[data-ui=xs] .tmail>span:last-child{display:none}
@media (prefers-reduced-motion:reduce){.tmail,.tmi svg{animation:none}}
.dbox{margin-top:10px;padding:8px;border:1px solid #6b5430;border-left:4px solid var(--rc);border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 14%,transparent),transparent)}
.dbh{display:flex;align-items:center;gap:9px;margin-bottom:6px}.dbh b{color:var(--gold2);font-size:14px}.dbh .tcrel{margin-left:auto;font-size:11px;font-weight:700;padding:0 7px;border-radius:9px;background:var(--rc);color:#1a130e}
.dbbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.dbbtns .btn{font-size:12px;padding:6px 4px;line-height:1.3}
#dlg.light{background:#0004;cursor:pointer}#dlg.light #dlgBox{cursor:auto}
#dlg.light #dlgBox::after{content:"外側をクリックすると閉じる";position:static;display:block;width:auto;height:auto;border:none;margin-top:8px;text-align:right;font-size:11px;color:var(--sub)}
#toast{max-width:min(720px,90vw);text-align:center;line-height:1.5}
/* 立体の地図 */
.v3c{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;cursor:grab;outline:none}
.mapw.v3 #map{visibility:hidden}
.mapw.v3 .zm,.mapw.v3 .mmode,.mapw.v3 .legend{z-index:4}
.v3l{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.v3load{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#172842;color:#fff;font-size:18px}
.v3only{display:none}.mapw.v3 .v3only{display:inline}.mapw.v3 .lg2d{display:none}
.k3{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;margin:-9px 0 0 -40px;width:80px;pointer-events:none;will-change:transform}
.k3i{display:flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#fffdf6;border:1px solid #5b4a36;box-shadow:0 1px 3px #0006}
.k3.main .k3i{width:21px;height:21px;background:#fff3d6;border:1.6px solid #8a1f1f}
.k3i svg{width:72%;height:72%;fill:#4a3a2a}
.k3i.k京 svg{fill:#b0861a}.k3i.k堺 svg{fill:#8a6a10}.k3i.k寺 svg{fill:#7a3a3a}.k3i.k港 svg{fill:#1f5a8a}.k3i.k銀 svg{fill:#5a5a5a}
.k3 span{font-size:11px;color:#2a2622;white-space:nowrap;margin-top:1px;line-height:1.2;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff}
.k3.main span{font-weight:700;font-size:12px}
.v3l[data-band="0"] .k3 span{display:none}
.v3l[data-band="0"] .k3.main .k3i{width:15px;height:15px;opacity:.9}
.v3l[data-band="1"] .k3:not(.main) span{display:none}
.t3u{position:absolute;left:0;top:0;display:flex;align-items:center;gap:2px;margin:-22px 0 0 -18px;pointer-events:auto;cursor:pointer;will-change:transform;font-size:12px;font-weight:700;line-height:1}
.t3u b{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:#2a2622;color:#fff;border:2px solid var(--hc)}
.t3u span{display:flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:#fff;color:#2a2622;border:1px solid #2a2622;font-size:11px}
.t3u em{font-style:normal;display:flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#2e9e44;color:#fff;font-size:10px;border:1px solid #fff}
.t3u.me b{box-shadow:0 0 0 2px #3d6fd6}
.t3u.sel b{box-shadow:0 0 0 3px #ffd34d}
/* ================= 黒漆と金のテーマ ================= */
:root,:root[data-theme="dark"],:root[data-theme="light"]{--bg:#120d09;--paper:#1f1711;--ink:#f1e4c6;--sub:#c2ab7c;--line:#6b5430;--acc:#e2c27a;--good:#7fd69a;--bad:#ff8a7a;--tick:#0b0805;--tickfg:#f1e4c6;--gold:#d8b25e;--gold2:#f3d98f;--ver:#8e2a1e;--land:#efe6d2;--sea:#c9dbe3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d09;--paper:#1f1711;--ink:#f1e4c6;--sub:#c2ab7c;--line:#6b5430;--acc:#e2c27a;--good:#7fd69a;--bad:#ff8a7a;--tick:#0b0805;--land:#efe6d2;--sea:#c9dbe3}}
body{font-family:"BIZ UDPMincho","BIZ UDP明朝 Medium","BIZ UDPGothic",serif;background:radial-gradient(ellipse at 50% 0%,#2a1d12,#0b0805 70%)}
.zm button,.mmode,.legend,#endBtn,.btn,.abtn{font-family:"BIZ UDPMincho","BIZ UDPGothic",serif}
/* 欄（漆の板＋金の飾り枠） */
#panel{background:linear-gradient(180deg,#160f0a,#0e0a07);border-left:1px solid #5a4423}
.card,#dlgBox,.title,.result{position:relative;background:radial-gradient(ellipse at 15% 0%,#3a2a1b 0,transparent 55%),linear-gradient(170deg,#241a12 0%,#18110c 60%,#110c08 100%);
  border:1px solid var(--gold);box-shadow:inset 0 0 0 3px #140e09,inset 0 0 0 4px #8a6a2f99,inset 0 0 36px #0009,0 6px 16px #0008;border-radius:4px;color:var(--ink)}
.card::before,.card::after,#dlgBox::before,#dlgBox::after,.title::before,.title::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--gold2);pointer-events:none}
.card::before,#dlgBox::before,.title::before{left:-3px;top:-3px;border-right:none;border-bottom:none}
.card::after,#dlgBox::after,.title::after{right:-3px;bottom:-3px;border-left:none;border-top:none}
.card h3,#dlgBox h3{color:var(--gold2);letter-spacing:.12em;font-weight:700;border-bottom:1px solid #8a6a2f88;padding-bottom:4px;text-shadow:0 0 8px #e2b45a44}
.hint{color:var(--sub)}
.dot.big{box-shadow:0 0 0 2px var(--gold),0 0 10px #e2b45a55}
/* ボタン */
.btn{background:linear-gradient(#2c2117,#1a130d);color:var(--ink);border:1px solid #8a6a2f;border-radius:3px;box-shadow:inset 0 1px 0 #ffffff10}
.btn:hover:not(:disabled){border-color:var(--gold2);color:#fff;box-shadow:0 0 8px #e2b45a55}
.btn.pri{background:linear-gradient(#a8382a,#6e1d13);border-color:var(--gold);color:#fff3d6;text-shadow:0 1px 0 #0008;box-shadow:inset 0 1px 0 #ffffff30,0 0 0 1px #3a0e08}
.btn.pri:hover:not(:disabled){box-shadow:inset 0 1px 0 #ffffff30,0 0 12px #e2b45a88}
.btn.danger{border-color:#c0574a;color:#ffb3a8}
.abtn{background:linear-gradient(#2a1f15,#17110b);border:1px solid #8a6a2f;color:var(--ink);border-radius:4px}
.abtn:hover:not(:disabled){border-color:var(--gold2);box-shadow:0 0 10px #e2b45a55}
.abtn.pri{background:linear-gradient(#a8382a,#6e1d13);border-color:var(--gold);color:#fff3d6}
.abtn.on{border-color:var(--gold2);box-shadow:0 0 0 2px #e2b45a88,0 0 14px #e2b45a66}
.abtn b{letter-spacing:.08em}
.next{background:linear-gradient(90deg,#e2b45a22,transparent);border-left-color:var(--gold)}
.next.mv{background:linear-gradient(90deg,#4a78c822,transparent);border-left-color:#6f9be8}
.subp{border-color:#6b5430}
.army{border-color:#6b5430;background:#ffffff05}.army.on{border-color:var(--gold);box-shadow:0 0 0 1px #e2b45a55}
.mini{border-bottom-color:#4a3a22}.mini:hover,.drow:hover{background:#e2b45a14}
.goal{border-top-color:#6b5430}.goal.done{color:var(--good)}
.sech{color:var(--gold2)}
.warnb{color:#ffd36a}
.stat b{color:var(--gold2)}
#dlgBox select,#dlgBox input[type=text],.title select{background:#120d09;color:var(--ink);border:1px solid #8a6a2f;border-radius:3px}
.reply{border-color:#6b5430}
.inbox{border-color:var(--gold);background:#e2b45a10}
.steps{background:#ffffff08;border:1px solid #5a4423;border-radius:3px}
.bt{border-color:#6b5430;background:#ffffff05}.btt td,.btt th{border-color:#4a3a22}
.tl{border-color:#6b5430}
.bcard{background:linear-gradient(#3a2b1b,#251b11);color:var(--ink);border-color:#8a6a2f}
.ucard{border-color:#00000080;box-shadow:inset 0 0 0 1px #ffffff30}
/* 地図のボタン類 */
.zb{background:radial-gradient(#2e2318,#150f0a);color:var(--gold2);border:1.5px solid var(--gold);box-shadow:0 2px 8px #000a,inset 0 0 0 2px #140e09}
.zb:hover{border-color:var(--gold2);box-shadow:0 0 10px #e2b45a88}
.mmode,.legend{background:linear-gradient(#211810ee,#140e09ee);border:1px solid var(--gold);border-radius:3px;color:var(--ink)}
/* うわさの帯 */
#ticker{background:linear-gradient(#1a130d,#0b0805);border-bottom:1px solid var(--gold);color:var(--ink)}
#ticker .lab{background:linear-gradient(#a8382a,#6e1d13);color:#fff3d6;letter-spacing:.15em;border-right:1px solid var(--gold)}
/* 題字（行書風） */
.title h2,.yr,.evt,.scr span{font-family:"Yuji Syuku","BIZ UDPMincho",serif}
.title{max-width:760px;padding:28px 32px}
.rimg{height:300px;margin:-20px -20px 0;background:center/cover no-repeat;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.timg{height:280px;margin:-28px -32px 0;background:center/cover no-repeat;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.timg+.ttop{margin-top:-90px;position:relative}
.ttop{text-align:center;padding:10px 0 14px;margin-bottom:12px;border-bottom:1px solid #8a6a2f88}
.title h2{font-size:84px;line-height:1.05;color:var(--gold2);letter-spacing:.18em;text-shadow:0 2px 0 #000,0 0 16px #000,0 0 30px #000c,0 0 18px #e2b45a66;margin:0;font-weight:400}
.tsub{font-size:16px;letter-spacing:.6em;color:#e8d4a6;margin-top:4px;text-shadow:0 0 8px #000,0 0 12px #000}
.q{border-left-color:var(--gold);color:var(--gold2)}
/* 年号 */
.evx{display:grid;grid-template-columns:1fr;position:relative;margin:-18px -18px 8px}
.evimg{height:250px;background:#0b0805 center/cover no-repeat;border-bottom:1px solid var(--gold);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.evimg.none{height:120px;background:radial-gradient(ellipse at 50% 120%,#6e1d1366,transparent 70%),repeating-linear-gradient(115deg,#ffffff05 0 2px,transparent 2px 9px)}
.evyr{position:absolute;left:0;right:0;bottom:-6px;text-align:center}
.yr{font-size:64px;line-height:1.1;font-weight:400;color:var(--gold2);letter-spacing:.12em;text-shadow:0 3px 0 #000,0 0 14px #000,0 0 30px #000c,0 0 22px #e2b45a77}
.yr.sm{font-size:40px}
.yrw{font-size:13px;color:#e8d4a6;letter-spacing:.2em;text-shadow:0 0 6px #000,0 0 10px #000}
.evt{text-align:center;font-size:30px!important;font-weight:400!important;border:none!important;margin:10px 0 4px!important;color:#fff0cf!important}
.evd{line-height:1.8;font-size:15px}
.rsh{display:flex;align-items:center;gap:14px;border-bottom:1px solid #8a6a2f88;padding-bottom:6px;margin-bottom:8px}
.rsht{font-size:18px;font-weight:700;color:var(--gold2);letter-spacing:.15em}.rsht small{display:block;font-size:12px;color:var(--sub);letter-spacing:.1em}
/* 巻物の帯 */
.scr{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:220px;padding:6px 38px;margin:2px 10px;
  background:linear-gradient(180deg,#e9dcb8 0%,#f6edd2 45%,#ddc99a 100%);color:#2a1a0e;box-shadow:0 3px 8px #000a,inset 0 0 18px #a07a3a55}
.scr::before,.scr::after{content:"";position:absolute;top:-5px;bottom:-5px;width:14px;border-radius:5px;background:linear-gradient(90deg,#3a2414,#8a5a30 45%,#3a2414);box-shadow:0 2px 4px #0009}
.scr::before{left:-9px}.scr::after{right:-9px}
.scr span{font-size:28px;letter-spacing:.18em;line-height:1.2;text-shadow:0 1px 0 #fff8}
.scr.sm{min-width:0;padding:2px 22px;margin:2px 8px}.scr.sm span{font-size:18px}.scr.sm::before,.scr.sm::after{width:9px;top:-3px;bottom:-3px}.scr.sm::before{left:-6px}.scr.sm::after{right:-6px}
.bvhd{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px}.bvsub{color:var(--sub);font-size:14px}
.bth{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.bvkind{background:linear-gradient(#a8382a,#6e1d13);border:1px solid var(--gold)}
/* 戦いの場面（暗い背景に合わせて） */
.bvc{background:#2a1f15;border-color:#6b5430}.bvc .bn,.bvc .bm{color:var(--ink)}
.bvc.ashi .bk{color:#e8c48a}.bvc.kiba .bk{color:#ff9a8a}.bvc.yumi .bk{color:#a8e090}.bvc.teppo .bk{color:#a8c0ff}.bvc.gar{background:#3a2b1b}
.bvlog{border-top-color:#6b5430}.bvlog .ph{color:var(--gold2)}
#bvf{border-color:var(--gold)}
.bvmod{background:#ffffff08;border-color:#6b5430}
/* 結果・終わりの画面 */
.result h2{font-family:"Yuji Syuku","BIZ UDPMincho",serif;font-size:36px;font-weight:400;color:var(--gold2);letter-spacing:.1em}

 1562:{t:'清洲同盟',d:'尾張の織田信長と三河の松平元康が同盟を結んだ。背後の心配がなくなった両家は、それぞれ別の方向へ勢力を広げていく。となりの家と同盟を結べば、守りに兵を割かずにすむ。'},
 1570:{t:'姉川の戦いと信長包囲網',d:'京都をおさえた大名に対して、浅井・朝倉・武田・本願寺などが手を結び、まわりから同時に攻めようとしている。強くなりすぎた家は、まわりの家からいっせいにねらわれやすい。'},
 1578:{t:'上杉謙信の死',d:'越後の上杉謙信が亡くなり、家の中で跡継ぎをめぐる争いが起きた。大名が亡くなると、強い家でも急に弱まることがある。'},
 1580:{t:'石山合戦の終わり',d:'10年にわたって戦い続けてきた石山本願寺が、朝廷の仲立ちで大坂の地を明けわたした。各地の一向一揆の力は、しだいに弱まっていく。'},
 1586:{t:'豊臣の姓と全国統一への道',d:'関白となった羽柴秀吉は、朝廷から豊臣の姓をあたえられた。惣無事令にしたがわない大名を攻め、全国統一は目前にせまっている。'},
 1560:{t:'桶狭間の戦いの直前',d:'駿河・遠江・三河を従える今川義元が、大軍で尾張へ向かおうとしている。尾張の織田信長は、まだ小さな大名にすぎない。幕府の力はおとろえ、各地の戦国大名が領地を広げようと争っている。'},
 1564:{t:'三河の一向一揆',d:'三河では、一向宗の信者たちが領主にそむいて一揆を起こしている。一向宗の力が強い地域（卍のある地域の近く）では、一揆に気をつけなければならない。'},
 1566:{t:'鉄砲の広まり',d:'1543年に種子島に伝わった鉄砲は、堺や紀伊の雑賀、近江の国友でつくられるようになった。これらの地域を持つ家は、鉄砲隊を集められる。'},
 1568:{t:'足利義昭が上洛を求める',d:'足利義昭が、自分を京都へ連れていき、将軍にしてくれる大名を探している。京都をおさえた家は「上洛する」を使えるようになった。'},
 1572:{t:'南蛮貿易と楽市・楽座',d:'ポルトガルの南蛮船が、長崎や平戸などの港に来るようになった。城下町で自由な商売を認める「楽市・楽座」も使えるようになった。'},
 1574:{t:'長篠の戦い',d:'三河の長篠で、大量の鉄砲隊をそろえた織田・徳川の軍が、武田の騎馬隊を破った。これからは、鉄砲隊の遠戦の力が大きくなる。'},
 1576:{t:'安土城と天下布武',d:'近江に、天守をもつ巨大な城が建てられた。「天下布武」の印を使う大名は、武力で天下を統一しようとしている。'},
 1582:{t:'本能寺の変',d:'天下統一に最も近い大名の家で、家臣がそむいた。いちばん多くの石高を持つ家は、京都に最も近い軍勢を失い、その地域は家臣のものになる。'},
 1584:{t:'太閤検地と関白',d:'京都をおさえた大名が、全国の田畑の広さと収穫量を調べる「検地」を始めた。朝廷から関白の位を得た大名は、「惣無事令」で大名どうしの争いを禁じようとしている。'},

/* ---------- 兵を集める ---------- */

/* ---------- コンピューターの大名 ---------- */

  S.lastOrders=JSON.parse(JSON.stringify(orders));
  S.lastStart={};S.lastH={};S.armies.forEach(x=>{S.lastStart[x.id]=x.a;S.lastH[x.id]=x.h;});
  const battles=yield* resolveTurnG(orders);

  // 籠城：包囲がつづいていれば兵糧がへる。尽きたら落城。包囲の軍勢がいなくなれば包囲はとける
  for(const a in (S.siege||{})){const sg=S.siege[a];const owner=S.own[a];

  for(const a of AREAS){if(S.siege&&S.siege[a.id])continue;const f=garFull(a.id);const g=S.gar[a.id];for(const t of TORDER)g[t]=Math.min(f[t],g[t]+Math.ceil(f[t]*0.5));}
  for(const x of S.armies){x.rec=0;x.g=guardMax(x);}   // 旗本は年ごとにそろいなおす

  S.armies=S.armies.filter(x=>totU(x)>=1);
  // 地域をなくした家の軍勢はちりぢりに

      if(!was&&by&&alive(by)&&!(S.lord&&S.lord[h])&&by!==h){makeVassal(h,by);

        S.log.push({y:yearNow(),t:`すべての領地を失い、${hn(by)}の家臣となる（軍勢は残る）`});

    S.armies=S.armies.filter(x=>x.h!==h);S.dead[h]=yearNow();news(`${hn(h)}が滅んだ`);if(h===S.me)S.log.push({y:yearNow(),t:'すべての地域を失い、家が滅ぶ'});

function honnoji(){
  let top=null,max=-1;for(const h in H){if(!alive(h))continue;const n=kokuOf(h);if(n>max){max=n;top=h;}}
  if(!top)return;const ars=armiesOf(top);if(!ars.length)return;
  const dist=a=>{const q=[[a,0]],seen=new Set([a]);while(q.length){const [x,d]=q.shift();if(x==='kyoto')return d;for(const n of nbr(x))if(!seen.has(n)){seen.add(n);q.push([n,d+1]);}}return 99;};

  if(S.own[ar.a]===top&&!isHonjo(ar.a,top)){delete S.own[ar.a];S.gar[ar.a]=garFull(ar.a);}
  news(`本能寺の変：${hn(top)}の家臣がそむき、${A[ar.a].n}の軍勢を失った`);
  if(top===S.me)S.log.push({y:1581,t:`家臣がそむき、${A[ar.a].n}の軍勢を失う（本能寺の変）`});

// いま送れる書状の種類（家臣のあいだは、外交は主君にまかせる）
function letterTypesFor(to){const me=S.me;const vas=S.lord&&S.lord[me];
  if(vas)return S.lord[me]===to?['support','gift','dokuritsu']:sameCamp(me,to)?['support','gift']:['gift'];
  if(sameCamp(me,to))return ['support','gift'];

function sendLetter(to,type,target,text){
  const me=S.me;const r=rel(me,to);const myN=troopsOf(me),thN=troopsOf(to);
  const enemyOfEnemy=neighborsOf(to).some(x=>x!==me&&rel(to,x)==='teki'&&rel(me,x)==='teki');
  let ok=false,reply='';
  const myK=campKoku(me),thK=campKoku(to);
  if(!letterTypesFor(to).includes(type)){reply=S.lord&&S.lord[me]?`（家臣なので、ほかの家との外交は主君の${hn(S.lord[me])}が行う）`:'（この書状は送れない）';}
  else if(S.lord&&S.lord[to]&&!sameCamp(me,to)){reply=`わが家は${hn(S.lord[to])}の家臣である。話は主君にしてほしい。`;}
  else if(type==='kudaru'){const p=thK<myK*0.8?0.08:r==='teki'?0.75:0.9;ok=Math.random()<p;
    if(ok){makeVassal(me,to);reply='よくぞ決心された。これより貴家はわが家の家臣である。ともに天下をめざそう。';S.log.push({y:yearNow(),t:`${hn(to)}の軍門に下り、家臣となる`});news(`${hn(me)}が${hn(to)}の軍門に下り、家臣となった`);}

    if(ok){makeVassal(to,me);reply='……やむをえぬ。貴家の軍門に下ろう。';S.log.push({y:yearNow(),t:`${hn(to)}が軍門に下り、家臣となる`});news(`${hn(to)}が${hn(me)}の軍門に下り、家臣となった`);}
    else{reply=q<1.5?'われらを家臣にしようなど、思い上がりもはなはだしい。':'まだ、われらは戦える。';if(q<1.5&&r!=='teki')setRel(me,to,'teki');}}
  else if(type==='dokuritsu'){if(S.lord[me]!==to)reply='（あなたの主君ではない）';else{releaseVassal(me,'teki');ok=true;reply='恩知らずめ。次に会うのは戦場だ。';S.log.push({y:yearNow(),t:`${hn(to)}からはなれて独立する`});news(`${hn(me)}が${hn(to)}からはなれて独立した`);}}

    const q=myK/Math.max(1,thK);
    let p=0.4+(q>=1.3?0.2:q<0.7?-0.2:0)+(myN>=thN?0.1:-0.1)+(enemyOfEnemy?0.15:0);
    const pay=S.gold[me]>=5;if(pay)p+=0.15;p=Math.max(0.05,Math.min(0.9,p));ok=Math.random()<p;
    if(ok){if(pay){S.gold[me]-=5;S.gold[to]+=5;}setRel(me,to,'none');reply=pay?'金5、たしかに受け取った。和睦しよう。これよりたがいに兵を引く。':'よかろう。和睦しよう。これよりたがいに兵を引く。';S.log.push({y:yearNow(),t:`${hn(to)}と和睦する${pay?'（金5をそえる）':''}`});news(`${hn(me)}と${hn(to)}が和睦した`);}

  else if(type==='domei'){const p=(r==='teki'?0.15:r==='fusen'?0.6:0.4)+(myN>=thN?0.15:0)+(enemyOfEnemy?0.2:0);ok=Math.random()<p;if(ok){setRel(me,to,'domei');reply='よかろう。これより両家は同盟である。';}else reply=r==='teki'?'これまでのいきさつがある。同盟など結べぬ。':'今はまだ、その時ではない。';}
  else if(type==='fusen'){const p=(r==='teki'?0.3:0.65)+(myN>thN?0.1:0);ok=Math.random()<p;if(ok){if(r!=='domei')setRel(me,to,'fusen');reply='承知した。たがいに兵を向けぬことを約束しよう。';}else reply='約束はできぬ。';}

  else if(type==='gift'){if(S.gold[me]<5)reply='（金が足りない）';else{S.gold[me]-=5;S.gold[to]+=5;ok=true;reply='ありがたく受け取ろう。';if(r==='teki'&&Math.random()<.5){setRel(me,to,'none');reply+='これまでのことは水に流そう。';}}}

  S.letters.push(L);

  return L;
}

/* ---------- 街道の道すじ（地形にそった曲線） ---------- */
function chaikin(P,n=2){for(let k=0;k<n;k++){const Q=[P[0]];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];Q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);}Q.push(P[P.length-1]);P=Q;}return P;}
const ROAD_CACHE={};
function roadPts(a,b){const key=a+'>'+b;if(ROAD_CACHE[key])return ROAD_CACHE[key];
  let P=(typeof ROAD_PATH!=='undefined')&&(ROAD_PATH[a+'|'+b]||(ROAD_PATH[b+'|'+a]&&ROAD_PATH[b+'|'+a].slice().reverse()));
  P=P&&P.length>2?chaikin(P,2):[A[a].c,A[b].c];P=P.map(q=>q.slice());P[0]=A[a].c.slice();P[P.length-1]=A[b].c.slice();
  return ROAD_CACHE[key]=P;}
function routePts(path){if(path.length<2)return path.map(a=>A[a].c.slice());let out=[A[path[0]].c.slice()];for(let i=0;i<path.length-1;i++)out=out.concat(roadPts(path[i],path[i+1]).slice(1).map(q=>q.slice()));return out;}
/* ---------- 軍勢の待機位置：城のすぐそば、街道の上に立つ ---------- */
const STAND_SP=10;                                             // 同じ街道に並ぶときの間かく
const standD0=a=>A[a].k==='京'?13:A[a].k==='堺'?11:8;         // 城（建物）のまん中からのきょり
function ptAlong(P,d){for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=L){const f=L?d/L:0;return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}d-=L;}return P[P.length-1].slice();}
function standPt(a,b,k){const P=roadPts(a,b);return ptAlong(P,Math.min(standD0(a)+k*STAND_SP,plen(P)*0.3));}
const landRoads=a=>nbr(a).filter(b=>EDGE[a][b].r!=='海路').sort((x,y)=>EDGE[a][x].c-EDGE[a][y].c);
// どの街道に立つか：これから進む道 → 通ってきた道 → 敵や他家のほうへ向かう道
function standRoad(ar){const a=ar.a,R=landRoads(a);if(!R.length)return null;
  const o=S.orders&&S.orders[ar.id];if(o&&o.length&&R.includes(o[0]))return o[0];
  const lo=S.lastOrders&&S.lastOrders[ar.id],st=S.lastStart&&S.lastStart[ar.id];
  if(lo&&st&&st!==a){const p=[st].concat(lo);const i=p.indexOf(a);if(i>0&&R.includes(p[i-1]))return p[i-1];}
  const sc=b=>{const w=S.own[b];return (w&&!sameCamp(w,ar.h)?2:!w?1:0)+(w&&rel(ar.h,w)==='teki'?3:0)+(EDGE[a][b].c===1?0.5:0);};
  return R.slice().sort((x,y)=>sc(y)-sc(x))[0];}
function standPos(ar){const a=ar.a,c=A[a].c;const list=armiesAt(a).slice().sort((x,y)=>x.id-y.id);const used={};
  for(let j=0;j<list.length;j++){const x=list[j];const b=standRoad(x);
    if(!b){if(x===ar)return [c[0]+(j-(list.length-1)/2)*14,c[1]+13];continue;}
    const k=used[b]=(used[b]||0)+1;if(x===ar)return standPt(a,b,k-1);}
  return c.slice();}
// 動き始め・着いた所の待機位置（アニメーション用）
const standToward=(a,b)=>b&&EDGE[a]&&EDGE[a][b]&&EDGE[a][b].r!=='海路'?standPt(a,b,0):A[a].c.slice();
const plen=P=>{let s=0;for(let i=1;i<P.length;i++)s+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);return s;};
function trimEnd(P,d){P=P.map(q=>q.slice());while(P.length>1&&d>0){const a=P[P.length-2],b=P[P.length-1];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<=d){P.pop();d-=L;}else{const f=(L-d)/L;P[P.length-1]=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];d=0;}}return P;}
// 矢印の形：道にそった胴と、先の矢じり
function arrowShape(P,tipOff,hl){const T=trimEnd(P,tipOff);const body=trimEnd(T,hl);const tip=T[T.length-1],base=body[body.length-1];
  let ux=tip[0]-base[0],uy=tip[1]-base[1];const L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;return {body,tip,base,ux,uy};}

    const cls=e.r==='海路'?'sea':e.c===1?'main':'mtn';const pts=(cls==='sea'?[a,b]:roadPts(x,y)).map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

}
function lodK(){const z=UI.full[2]/UI.vb[2];return Math.max(0.32,Math.min(1.15,Math.pow(z,-0.62)));}
function setVB(){const svg=$('#map');svg.setAttribute('viewBox',UI.vb.join(' '));const z=UI.full[2]/UI.vb[2];
  // 平面の地図：いちばん引いたあたりで、軍勢の駒・矢印・にらみの範囲をうすくし、全国を見わたすときは消す
  {const af=Math.max(0,Math.min(1,(z-1.12)/(1.7-1.12)));for(const id of ['gU','gO','gZ']){const e=document.getElementById(id);if(e){e.style.opacity=af.toFixed(2);e.style.visibility=af<0.02?'hidden':'';}}}
  svg.classList.toggle('far',z<1.9);svg.classList.toggle('mid',z>=1.9&&z<3.4);svg.classList.toggle('near',z>=3.4);
  const k=lodK();if(UI._k!==k){UI._k=k;if(S&&$('#gO'))drawOrders();if(S&&$('#gZ'))drawZoc();for(const e of svg.querySelectorAll('.sc'))e.setAttribute('transform',`translate(${e.dataset.x},${e.dataset.y}) scale(${k})`);}}
function scG(parent,x,y,cls){const g=el('g',{class:'sc '+(cls||''),'data-x':x,'data-y':y,transform:`translate(${x},${y}) scale(${lodK()})`},parent);return g;}
function zoom(f,e){const svg=$('#map');const r=svg.getBoundingClientRect();const px=e?(e.clientX-r.left)/r.width:0.5,py=e?(e.clientY-r.top)/r.height:0.5;
  const nw=Math.min(UI.full[2]*1.3,Math.max(90,UI.vb[2]*f)),nh=nw*UI.vb[3]/UI.vb[2];UI.vb[0]+=(UI.vb[2]-nw)*px;UI.vb[1]+=(UI.vb[3]-nh)*py;UI.vb[2]=nw;UI.vb[3]=nh;setVB();if(on3D()&&!e)T3D.zoom(f);}
function fitMap(){const r=$('#map').getBoundingClientRect();const f=UI.full;const ar=r.width/r.height;let w=f[2],h=f[3];if(w/h>ar)h=w/ar;else w=h*ar;UI.vb=[f[0]-(w-f[2])/2,f[1]-(h-f[3])/2,w,h];setVB();if(on3D())T3D.fit();}
function focusOn(list,pad=160){if(!list.length)return fitMap();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const a of list){const c=A[a].c;x0=Math.min(x0,c[0]);y0=Math.min(y0,c[1]);x1=Math.max(x1,c[0]);y1=Math.max(y1,c[1]);}
  const r=$('#map').getBoundingClientRect();const ar=r.width/r.height;let w=Math.max(220,x1-x0+pad),h=Math.max(220,y1-y0+pad);if(w/h>ar)h=w/ar;else w=h*ar;UI.vb=[(x0+x1)/2-w/2,(y0+y1)/2-h/2,w,h];setVB();if(on3D())T3D.focus(list,pad);}

    for(const tr of tracks){let s=e*tr.tot,i=0;while(i<tr.L.length-1&&s>tr.L[i]){s-=tr.L[i];i++;}
      const a=tr.pts[i],b=tr.pts[i+1],f=tr.L[i]?Math.min(1,s/tr.L[i]):1;const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f;

function actionMenu(ar,mine){

  const tabs={

     <button class="btn small wide2" type="button" onclick="newArmyDlg()">＋ 新しい軍勢をつくる（あいている武将 ${freeBusho(me).length}人）</button></div>`,

function dipBox(o){const me=S.me;if(!o||!H[o]||o===me||!alive(o)||S.dead[me])return '';
  const r=rel(me,o);const L=k=>LETTER_TYPES.find(t=>t.id===k);const myLord=S.lord&&S.lord[me],oLord=S.lord&&S.lord[o];
  const ic={domei:'🤝',fusen:'🕊',support:'⚑',gift:'🎁',break:'✂',threat:'⚔',kudaru:'🙇',kosan:'🏳',dokuritsu:'🗡',wabo:'☮'};
  let want,note='',sub=[];
  if(r==='kashin'){want=letterTypesFor(o);note=myLord===o?`${hn(o)}はあなたの主君。あなたはこの陣営の一員として戦う。`:oLord===me?`${hn(o)}はあなたの家臣。あなたの陣営の一員として戦う。`:`${hn(o)}は同じ陣営（${hn(topOf(o))}の家臣）。`;}
  else if(myLord){want=['gift'];note=`あなたは${hn(myLord)}の家臣なので、ほかの家との外交は主君が行う（贈り物だけはできる）。`;}
  else if(oLord){want=[];note=`${hn(o)}は${hn(oLord)}の家臣。外交は主君の${hn(oLord)}と行う。`;}
  else{want=r==='teki'?['wabo','fusen','gift','threat']:r==='none'?['domei','fusen','gift']:['support','gift','break'];sub=['kudaru','kosan'];}
  const btn=k=>`<button type="button" class="btn small ${k==='kudaru'||k==='kosan'||k==='dokuritsu'?'bkas':''}" onclick="letterDlg('${o}','${k}')">${ic[k]} ${esc(L(k).n)}</button>`;
  const rn=r==='kashin'?kashinName(o):relName(r)==='とくになし'?'中立':relName(r);
  return `<div class="dbox" style="--rc:${DIPCOL[r]||DIPCOL.none}"><div class="dbh">${faceUrl(o)?`<span class="tcface" style="--hc:${H[o].col}"><img src="${faceUrl(o)}" alt=""><i>${kamonHTML(o)}</i></span>`:`<span class="tckm s" style="background:${H[o].col}">${kamonHTML(o)}</span>`}
    <div><b>${esc(hn(o))}との外交</b>${whoTag(o)}<div class="hint">当主 ${esc(lordIdx(o)>=0?S.busho[o][lordIdx(o)].n:'')}・${Math.round(kokuOf(o))}万石・兵${(troopsOf(o)*100).toLocaleString()}人</div></div><span class="tcrel">${rn}</span></div>
    ${note?`<p class="dnote">${esc(note)}</p>`:''}
    ${want.length?`<div class="dbbtns">${want.map(btn).join('')}</div>`:''}
    ${sub.length?`<div class="dbsub"><span>主従</span>${sub.map(btn).join('')}</div>`:''}
    ${oLord&&!myLord&&r!=='kashin'?`<button type="button" class="btn small wide2" onclick="openDip('${oLord}')">${esc(hn(oLord))}（主君）と外交する</button>`:''}
    ${want.length||sub.length?`<button type="button" class="btn small wide2" onclick="letterDlg('${o}')">✉ ${esc(H[o].n)}家に書状を書く（ほかの内容）</button>`:''}</div>`;}

function dipList(){

function stepTurn(input){let r;

      if(f.k==='arrow'&&q<=1){const x=f.x0+(f.x1-f.x0)*q,y=f.y0+(f.y1-f.y0)*q-Math.sin(q*Math.PI)*40;const x2=f.x0+(f.x1-f.x0)*(q-0.05),y2=f.y0+(f.y1-f.y0)*(q-0.05)-Math.sin((q-0.05)*Math.PI)*40;g.strokeStyle='#2a1a0e';g.lineWidth=1.8;g.beginPath();g.moveTo(x2,y2);g.lineTo(x,y);g.stroke();}
      if(f.k==='gun'){if(q<=1){g.strokeStyle='rgba(255,230,150,0.9)';g.lineWidth=1.2;g.beginPath();g.moveTo(f.x0+(f.x1-f.x0)*Math.max(0,q-0.3),f.y0+(f.y1-f.y0)*Math.max(0,q-0.3));g.lineTo(f.x0+(f.x1-f.x0)*q,f.y0+(f.y1-f.y0)*q);g.stroke();}
        const sq=(now-f.t)/(f.d+400);g.fillStyle=`rgba(240,240,235,${0.6*(1-sq)})`;g.beginPath();g.arc(f.x0+(f.x1>f.x0?14:-14)+sq*8,f.y0-sq*10,5+sq*9,0,Math.PI*2);g.fill();}
      if(f.k==='spark'&&q<=1){g.strokeStyle=`rgba(255,${200+Math.random()*55|0},80,${1-q})`;g.lineWidth=1.6;for(let a=0;a<5;a++){const an=a*1.26+f.t%3;g.beginPath();g.moveTo(f.x0,f.y0);g.lineTo(f.x0+Math.cos(an)*(4+q*9),f.y0+Math.sin(an)*(4+q*9));g.stroke();}}}
    {const L=ALL.slice().sort((p,q)=>p.y-q.y);for(const u of L)drawU(u);}
    g.font='bold 13px "BIZ UDPGothic",sans-serif';g.textBaseline='top';g.fillStyle='rgba(255,253,246,0.92)';
    for(const [txt,al,xx] of [[iA.name,'left',8],[iD.name,'right',W-8]]){g.textAlign=al;g.lineWidth=3;g.strokeStyle='rgba(0,0,0,0.55)';g.strokeText(txt,xx,6);g.fillText(txt,xx,6);}
    for(const b of bubbles)drawBubble(b,now);
    if(banner){const q=(now-banner.t0)/banner.ms;if(q<=1){g.save();g.globalAlpha=Math.min(1,q*5,(1-q)*4);g.fillStyle='rgba(20,12,8,0.78)';g.fillRect(0,Hh/2-26,W,52);g.font='bold 30px "Yuji Syuku","BIZ UDPMincho",serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#ffb0a4';g.fillText(banner.text,cx,Hh/2+1);g.restore();}}
  };
  const setPhase=(ph,d)=>{cur=ph;t0=performance.now();dur=Math.max(200,d);for(const u of ALL){u.px=u.x;u.py=u.y;u.tx=X(u,ph);u.ty=Y(u,ph);}};
  const find=(sid,idx)=>idx==='cmd'?(ALL.find(u=>u.sid===sid&&u.role==='cmd'&&u.g.main)||ALL.find(u=>u.sid===sid&&u.role==='cmd')||ALL.find(u=>u.sid===sid)):ALL.find(u=>u.sid===sid&&u.i===idx);
  return {start(){t0=performance.now();dur=1000;raf=requestAnimationFrame(frame);},
    setForms(a,d){forms={A:a,D:d};t0=performance.now();dur=900;for(const u of ALL){u.px=u.x;u.py=u.y;u.tx=X(u,-1);u.ty=Y(u,-1);}},
    phase(ph,fA,tA,fD,tD,gfA,gtA,gfD,gtD,d){setPhase(ph,d);
      UA.forEach(u=>{if(u.role==='cmd'){u.nf=gfA[u.gi];u.nt=gtA[u.gi];}else{u.nf=fA[u.i];u.nt=tA[u.i];}});
      UD.forEach(u=>{if(u.role==='cmd'){u.nf=gfD[u.gi];u.nt=gtD[u.gi];}else{u.nf=fD[u.i];u.nt=tD[u.i];}});},
    rout(sid,d){rout=sid;t0=performance.now();dur=d;const L=sid==='A'?UA:UD;for(const u of ALL){u.px=u.x;u.py=u.y;u.nf=u.n;u.nt=u.n;}
      for(const u of L){u.tx=sid==='A'?-40:W+40;u.ty=u.y+(Math.random()-.5)*30;if(u.role!=='cmd')u.nt=u.n*0.85;}
      for(const u of (sid==='A'?UD:UA)){if(u.role==='gar')continue;u.tx=u.x+(sid==='A'?-30:30);u.ty=u.y;}},
    // 退却：しんがりの部隊だけが残り、ほかはマップの外へ。敵はしんがりにせまる
    retreat(sid,idx,d,nTo){ret={sid,idx};t0=performance.now();dur=d;const sh=find(sid,idx);
      for(const u of ALL){u.px=u.x;u.py=u.y;u.nf=u.n;u.nt=u.n;}
      for(const u of ALL){if(u.sid===sid){if(sh&&u===sh){u.tx=u.x+(sid==='A'?20:-20);u.ty=Hh/2;}else{u.tx=sid==='A'?-60:W+60;u.ty=u.y;}}
        else if(sh&&u.role!=='gar'&&u.role!=='cmd'){u.tx=sh.tx+(sid==='A'?blockW(u.n)/2+26:-blockW(u.n)/2-26)+(Math.random()-.5)*20;u.ty=Hh/2+(u.y-Hh/2)*0.45;}}
      if(sh&&nTo!=null)sh.nt=nTo;},
    bubble(sid,idx,text,ms){const u=find(sid,idx);if(u)bubbles.push({u,text,t0:performance.now(),ms:Math.max(600,ms)});},
    banner(text,ms){banner={text,t0:performance.now(),ms:Math.max(600,ms)};},
    stop(){stopped=true;cancelAnimationFrame(raf);}};

   <details><summary>ルールのまとめ</summary><ul>
    <li>1ターンは2年。1560年から1588年までの15ターンで終わる。1ターンに命令を出せる時間は2分。時間になると、命令を出していない軍勢はその場にとどまる。</li>
    <li>兵は4種類：歩（足軽）・騎（騎馬）・弓・鉄（鉄砲）。歩は騎に強く、騎は弓・鉄に強く、弓・鉄は歩に強い。</li>
    <li>戦いは「射撃戦→鑓合わせ→打撃→乱戦」の段階で進む（決着がつかなければ乱戦がつづく）。射撃戦では弓・鉄砲が撃ち合い、鉄砲の音と煙は敵の士気を下げる。鑓合わせでは長柄足軽が敵の足を止め、足を止めた敵には打撃（騎馬武者と旗本の突撃）が深く入る。</li>
    <li>士気が20以下になった軍勢は、くずれて敗走する。城を守る兵は士気が下がりにくく、城攻めでは攻める側の騎馬は馬を下りて戦い、城の弓・鉄砲は横矢をかける。政策「備を立てる」を行うと、打撃の力が上がり、士気もくずれにくくなる。</li>
    <li>大将には旗本（重い甲冑の武者）がつく。当主は200人、ほかの大将は100人で、1人で兵5人分の力がある。旗本が全滅すると大将は討ち死にする。野戦では、相手の総大将を討ち取るか、相手の兵を大きく減らせば勝ち。</li>
    <li>あなたの軍勢の戦いでは、はじめに陣形をえらぶ。魚鱗の陣（攻め）は鶴翼の陣に強く、鶴翼の陣（つり合い）は方円の陣に強く、方円の陣（守り）は魚鱗の陣に強い。城を守るときは、大将が前線で指揮するか、本丸で指揮するかをえらぶ。</li>
    <li>本拠の城と国の拠点の城は、攻めに負けてもすぐには落ちない。城兵が本丸にこもって籠城し、本拠は3ターン、拠点は2ターン持ちこたえる。そのあいだに軍勢を送り、包囲している敵を破れば城を守れる。包囲の軍勢がいなくなっても、包囲はとける。</li>
    <li>後詰め：命令を出していない軍勢は、となりの自分の城が攻められると、自動で助けに入っていっしょに守る（本拠のまわりに敵がいるときは動かない）。</li>
    <li>旗色が悪いときは「退却する」で退ける。いちばん経験のある部隊がしんがりになって敵を食い止め、そのあいだにほかの部隊が退く。</li>
    <li>軍勢は街道を通って動く。主な街道は1、山道・海路は2を使い、1ターンに3まで進める。敵や国人衆の地域に入るとそこで止まり、戦いになる。</li>
    <li>敵の軍勢がいる地域は、赤い斜線でぬられる（にらみの範囲）。そこに入った軍勢は止まり、その敵の軍勢と戦いになる。</li>
    <li>持てる兵の数は石高で決まる（1万石につき250人）。上限をこえると戦いの力が少し落ちる。兵には維持費がかかる。</li>
    <li>すべての領地を失っても、軍勢が残っていれば家は滅ばない。最後の城を取った大名の家臣になり、領地のない軍勢だけで主君のために戦う（領地がないあいだは維持費がかからない）。「独立する」の書状で下剋上すれば、領地のない軍勢だけで、ふたたび城を取りにいける。自分から軍門に下ったときは、領地をもったまま家臣になる。</li>

<script type="module">
/* =========================================================
   群雄割拠　立体の地図（three.js）
   標高：国土地理院の標高タイル（高さは8倍に強調）
   ========================================================= */
import * as THREE from 'three';
import {MapControls} from 'three/addons/controls/MapControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const X0=MAP_BG.x,Y0=MAP_BG.y,MW=MAP_BG.w,MH=MAP_BG.h;
const KM=1.249,EX=8,HS=4/KM*EX;      // 色の値1.0（4000m）の高さ
const OS=2;                           // 色をぬる画像：1単位あたりの画素
const SEG_X=512;
const PIECE_H=15;
// 引きにしたとき：軍勢の駒・札・矢印・にらみの範囲を、ARMY_FADE[0]から小さくうすくし、ARMY_FADE[1]で消す（カメラのきょり）
const ARMY_FADE=[400,540];
const toW=(x,y)=>[x-X0-MW/2,y-Y0-MH/2];
const toG=(wx,wz)=>[wx+X0+MW/2,wz+Y0+MH/2];
let R=null,host=null,running=false;

/* ---------- 高さ ---------- */
function hAt(u,v){
  const w=R.hw,h=R.hh,HD=R.HD;
  u=Math.min(1,Math.max(0,u));v=Math.min(1,Math.max(0,v));
  const x=u*(w-1),y=v*(h-1);const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(x0+1,w-1),y1=Math.min(y0+1,h-1);
  const fx=x-x0,fy=y-y0;const g=(a,b)=>{const i=(b*w+a)*4;return (HD[i]*256+HD[i+1])/65535;};
  return g(x0,y0)*(1-fx)*(1-fy)+g(x1,y0)*fx*(1-fy)+g(x0,y1)*(1-fx)*fy+g(x1,y1)*fx*fy;
}
const hRaw=(x,y)=>hAt((x-X0)/MW,(y-Y0)/MH)*HS;
// 建物と駒を置く所だけ、地面を平らにならす（まん中は平ら、まわりはなだらかに元の地形へもどす）
// r0：平らにする半径、r1：元の地形にもどるまでの半径（どちらも地図の単位）
const FLAT_BLD=0.8,FLAT_BLD_OUT=1.9,FLAT_PAD=[6,13];
function buildFlat(){const L=[];
  const site=(x,y,r0,r1)=>{// 平らにする高さ：平らな所の中の陸の高さの平均
    let s=0,n=0;for(let i=0;i<24;i++){const t=i/24*Math.PI*2;for(const k of [0,0.5,1]){const h=hRaw(x+Math.cos(t)*r0*k,y+Math.sin(t)*r0*k);if(h>0.05){s+=h;n++;}}}
    if(!n)return;L.push({x,y,r0,r1,h:s/n});};
  for(const a of AREAS){const k=propOf(a);const fp=k&&VIEW3D.props&&VIEW3D.props[k]?VIEW3D.props[k].fp:8;
    site(a.c[0],a.c[1],fp*FLAT_BLD,fp*FLAT_BLD_OUT);
    // 軍勢が立つ街道の上も、小さくならす
    const R=landRoads(a.id);if(!R.length)site(a.c[0],a.c[1]+13,FLAT_PAD[0],FLAT_PAD[1]);
    for(const b of R)for(let k=0;k<3;k++){const q=standPt(a.id,b,k);site(q[0],q[1],FLAT_PAD[0],FLAT_PAD[1]);}}
  // 探しやすいように升目に分ける
  const G=40,grid={};for(const f of L){const x0=Math.floor((f.x-f.r1)/G),x1=Math.floor((f.x+f.r1)/G),y0=Math.floor((f.y-f.r1)/G),y1=Math.floor((f.y+f.r1)/G);
    for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++)(grid[i+','+j]=grid[i+','+j]||[]).push(f);}
  R.flat={G,grid};}
function hFlat(x,y,h){if(!R.flat||h<=0.05)return h;const L=R.flat.grid[Math.floor(x/R.flat.G)+','+Math.floor(y/R.flat.G)];if(!L)return h;
  for(const f of L){const d=Math.hypot(x-f.x,y-f.y);if(d>=f.r1)continue;let w=d<=f.r0?1:1-(d-f.r0)/(f.r1-f.r0);w=w*w*(3-2*w);h=h+(f.h-h)*w;}
  return h;}
const hGame=(x,y)=>hFlat(x,y,hRaw(x,y));
const loadImg=src=>new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=src;});

/* ---------- 準備 ---------- */
async function init(){
  const canvas=document.createElement('canvas');canvas.className='v3c';
  let renderer;
  try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){return false;}
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x172842);
  const camera=new THREE.PerspectiveCamera(38,1,2,6000);
  const controls=new MapControls(camera,canvas);
  controls.enableDamping=true;controls.dampingFactor=0.12;controls.maxPolarAngle=1.22;controls.minDistance=70;controls.maxDistance=2600;
  controls.zoomSpeed=1.2;controls.screenSpacePanning=false;
  scene.add(new THREE.HemisphereLight(0xffffff,0x40506a,1.6));
  const sun=new THREE.DirectionalLight(0xfff2dc,2.1);sun.position.set(-500,800,450);scene.add(sun);
  // 駒と建物は別の場面に置き、地形・道・線のあとで描く（道や矢印の色が上にのらないように）
  const scene2=new THREE.Scene();scene2.add(new THREE.HemisphereLight(0xffffff,0x40506a,1.6));{const s2=sun.clone();scene2.add(s2);}

  let hImg,tex,mdl;
  const parseB64=async t=>{const bytes=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));return (await new GLTFLoader().parseAsync(bytes.buffer,'')).scene;};
  const loadModel=k=>fetch(VIEW3D.models[k].src).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}).then(parseB64).then(sc=>[k,sc]).catch(e=>{console.warn('model',k,e);return [k,null];});
  try{[hImg,tex,mdl]=await Promise.all([loadImg(VIEW3D.h),new THREE.TextureLoader().loadAsync(VIEW3D.tex),Promise.all(Object.keys(VIEW3D.models).map(loadModel))]);}
  catch(e){console.error(e);return false;}
  tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  const hc=document.createElement('canvas');hc.width=hImg.width;hc.height=hImg.height;
  const hx=hc.getContext('2d');hx.drawImage(hImg,0,0);
  R={canvas,renderer,scene,scene2,camera,controls,HD:hx.getImageData(0,0,hc.width,hc.height).data,hw:hc.width,hh:hc.height};

  // 色をぬる画像（勢力の色・境目・街道・選んだ地域）
  const oc=document.createElement('canvas');oc.width=Math.round(MW*OS);oc.height=Math.round(MH*OS);
  const ovTex=new THREE.CanvasTexture(oc);ovTex.colorSpace=THREE.NoColorSpace;ovTex.anisotropy=tex.anisotropy;
  R.oc=oc;R.ovTex=ovTex;
  // 光る層（ブルーム風）：境目の近くを家の色でぼんやり光らせる。陰影の影響を受けずに明るく見える
  const GS=OS*0.5;const gc=document.createElement('canvas');gc.width=Math.round(MW*GS);gc.height=Math.round(MH*GS);
  const glowTex=new THREE.CanvasTexture(gc);glowTex.colorSpace=THREE.SRGBColorSpace;R.gc=gc;R.GS=GS;R.glowTex=glowTex;R.glowAmt={value:0.55};

  // 地形
  const SEG_Y=Math.round(SEG_X*MH/MW);
  const geo=new THREE.PlaneGeometry(MW,MH,SEG_X,SEG_Y);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position,uv=geo.attributes.uv;
  buildFlat();
  for(let i=0;i<pos.count;i++){const u=uv.getX(i),v=1-uv.getY(i);pos.setY(i,hFlat(X0+u*MW,Y0+v*MH,hAt(u,v)*HS));}
  geo.computeVertexNormals();
  const mat=new THREE.MeshLambertMaterial({map:tex});
  const detTex=detailTex();R.detTex=detTex;
  // 近づいた区画の高精細の地面（4枚まで）
  R.hi=[0,1,2,3].map(()=>({tex:null,key:null,rect:new THREE.Vector4(0,0,0,0),mix:{value:0},want:0}));
  const blank=new THREE.DataTexture(new Uint8Array([0,0,0,255]),1,1);blank.needsUpdate=true;
  mat.onBeforeCompile=sh=>{sh.uniforms.ovMap={value:ovTex};sh.uniforms.detMap={value:detTex};sh.uniforms.glowMap={value:glowTex};sh.uniforms.glowAmt=R.glowAmt;
    sh.fragmentShader=sh.fragmentShader.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n{vec4 gw=texture2D(glowMap,vMapUv);totalEmissiveRadiance+=gw.rgb*gw.a*glowAmt;}');
    R.hi.forEach((h,i)=>{sh.uniforms['hi'+i]={value:h.tex||blank};sh.uniforms['hr'+i]={value:h.rect};sh.uniforms['hm'+i]=h.mix;h.u=sh.uniforms['hi'+i];});
    sh.fragmentShader=sh.fragmentShader.replace('#include <map_pars_fragment>','#include <map_pars_fragment>\nuniform sampler2D ovMap;uniform sampler2D detMap;uniform sampler2D glowMap;uniform float glowAmt;uniform sampler2D hi0,hi1,hi2,hi3;uniform vec4 hr0,hr1,hr2,hr3;uniform float hm0,hm1,hm2,hm3;')
      .replace('#include <map_fragment>',`#include <map_fragment>
 float hiA=0.0;
 {vec2 tt=(vMapUv-hr0.xy)/hr0.zw;if(hm0>0.0&&tt.x>=0.0&&tt.x<=1.0&&tt.y>=0.0&&tt.y<=1.0){diffuseColor.rgb=mix(diffuseColor.rgb,texture2D(hi0,tt).rgb,hm0);hiA=max(hiA,hm0);}}
 {vec2 tt=(vMapUv-hr1.xy)/hr1.zw;if(hm1>0.0&&tt.x>=0.0&&tt.x<=1.0&&tt.y>=0.0&&tt.y<=1.0){diffuseColor.rgb=mix(diffuseColor.rgb,texture2D(hi1,tt).rgb,hm1);hiA=max(hiA,hm1);}}
 {vec2 tt=(vMapUv-hr2.xy)/hr2.zw;if(hm2>0.0&&tt.x>=0.0&&tt.x<=1.0&&tt.y>=0.0&&tt.y<=1.0){diffuseColor.rgb=mix(diffuseColor.rgb,texture2D(hi2,tt).rgb,hm2);hiA=max(hiA,hm2);}}
 {vec2 tt=(vMapUv-hr3.xy)/hr3.zw;if(hm3>0.0&&tt.x>=0.0&&tt.x<=1.0&&tt.y>=0.0&&tt.y<=1.0){diffuseColor.rgb=mix(diffuseColor.rgb,texture2D(hi3,tt).rgb,hm3);hiA=max(hiA,hm3);}}
{vec3 b0=pow(max(diffuseColor.rgb,vec3(0.0)),vec3(1.0/2.2));float L=dot(b0,vec3(0.299,0.587,0.114));
 // 細かな模様：森のこずえ・野原の色むら・田畑のまだら（近づいたときに見える）
 vec3 dA=texture2D(detMap,vMapUv*vec2(10.0,9.31)).rgb;vec3 dB=texture2D(detMap,vMapUv*vec2(40.0,37.2)).rgb;
 float water=smoothstep(0.02,0.07,b0.b-b0.g);float green=smoothstep(0.0,0.10,b0.g-b0.r);float low=smoothstep(0.30,0.42,L);
 float f=(0.9+0.2*dA.r)*mix(1.0,0.72+0.5*dB.g,green*0.8);
 vec3 fld=(vec3(dA.b,dB.b,dA.g)-0.5)*vec3(0.10,0.08,0.03)*low;
 b0=mix(b0*mix(f,1.0,hiA*0.85)+fld*(1.0-hiA),b0,water);
 // 家の色：地形の明るさと細かさをのこしたまま、色だけをのせる
 vec4 ov=texture2D(ovMap,vMapUv);float Lo=max(dot(ov.rgb,vec3(0.299,0.587,0.114)),0.12);
 vec3 t=clamp(ov.rgb*(L/Lo)*1.08,0.0,1.0);
 diffuseColor.rgb=pow(mix(b0,t,ov.a),vec3(2.2));}`);};
  const land=new THREE.Mesh(geo,mat);scene.add(land);R.land=land;
  const seaFar=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),new THREE.MeshBasicMaterial({color:0x172842}));seaFar.rotateX(-Math.PI/2);seaFar.position.y=-0.5;scene.add(seaFar);

  // 地域の形（クリックの判定と色ぬり）
  R.path={};R.bb={};R.pctx=document.createElement('canvas').getContext('2d');
  for(const a of AREAS){R.path[a.id]=new Path2D(a.d);
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const m of a.d.matchAll(/(-?[\d.]+),(-?[\d.]+)/g)){const x=+m[1],y=+m[2];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    R.bb[a.id]=[x0,y0,x1,y1];
    R.hc=R.hc||{};R.hc[a.id]=hGame(a.c[0],a.c[1]);}

  // 兵科ごとの駒（足軽・騎馬・弓・鉄砲・当主）
  R.models={};
  for(const [k,base] of mdl){if(!base)continue;
    base.traverse(o=>{if(o.isLight)o.visible=false;if(o.isMesh){if(!o.geometry.attributes.normal)o.geometry.computeVertexNormals();const m=o.material;if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;o.material=new THREE.MeshLambertMaterial({map:m.map,color:m.map?0xffffff:(m.color||0xffffff)});}});
    const inner=new THREE.Group();inner.add(base);inner.rotation.y=VIEW3D.models[k].yaw||0;
    {const b=new THREE.Box3().setFromObject(inner);const c=b.getCenter(new THREE.Vector3());base.position.sub(new THREE.Vector3(c.x,b.min.y,c.z));}
    const h=new THREE.Box3().setFromObject(inner).getSize(new THREE.Vector3()).y;
    R.models[k]={obj:inner,h,cfg:VIEW3D.models[k]};}
  if(!Object.keys(R.models).length)return false;
  try{R.kamonImg=await loadImg(KAMON.src);}catch(e){R.kamonImg=null;}
  R.mats={};R.geoDisc=new THREE.CylinderGeometry(6,6.6,1.3,28);R.geoPole=new THREE.CylinderGeometry(0.22,0.22,14,6);
  R.geoFlag=new THREE.PlaneGeometry(4,7);R.geoHit=new THREE.BoxGeometry(14,PIECE_H+4,12);R.geoSel=new THREE.TorusGeometry(8.6,0.9,8,40);
  R.matSel=new THREE.MeshBasicMaterial({color:0xffd34d,transparent:true});R.borderMat={};R.matHit=new THREE.MeshBasicMaterial();
  R.pieceG=new THREE.Group();scene2.add(R.pieceG);R.arrowG=new THREE.Group();scene.add(R.arrowG);R.animG=new THREE.Group();scene2.add(R.animG);
  // 矢印の点線
  const dc=document.createElement('canvas');dc.width=32;dc.height=4;const dx=dc.getContext('2d');dx.fillStyle='#fff';dx.fillRect(0,0,20,4);
  R.dash=new THREE.CanvasTexture(dc);R.dash.wrapS=THREE.RepeatWrapping;

  // 地名と札をのせる層
  const lay=document.createElement('div');lay.className='v3l';R.labels=lay;
  R.alab=AREAS.map(a=>{const d=document.createElement('div');const main=isMain(a.id),sp=a.k!=='城';
    d.className='k3'+(main?' main':'')+(sp?' sp':'');
    d.innerHTML=`<i class="k3i k${a.k}"><svg viewBox="0 0 512 512"><path d="${ICONS[a.k]}"/></svg></i><span>${a.n}</span>`;
    lay.appendChild(d);return {a,d,main,sp,x:0,y:0,vis:null};});
  R.hnBox=document.createElement('div');R.hnBox.className='h3box';lay.insertBefore(R.hnBox,lay.firstChild);R.hn=[];

/* ---------- 地面の細かな模様（くり返し使える512pxの画像をその場でつくる） ---------- */
function detailTex(){const N=512;const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');const img=x.createImageData(N,N);
  let sd=12345;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const grid=n=>{const gg=new Float32Array(n*n);for(let i=0;i<n*n;i++)gg[i]=rnd();return gg;};
  const vn=(gg,n,u,v)=>{const X=u*n,Y=v*n;const x0=Math.floor(X),y0=Math.floor(Y);const fx=X-x0,fy=Y-y0;const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    const g_=(a,b)=>gg[((b%n+n)%n)*n+((a%n+n)%n)];return (g_(x0,y0)*(1-sx)+g_(x0+1,y0)*sx)*(1-sy)+(g_(x0,y0+1)*(1-sx)+g_(x0+1,y0+1)*sx)*sy;};
  const O=[[8,0.4],[16,0.3],[32,0.2],[64,0.1]].map(([n,w])=>[grid(n),n,w]);const cn=grid(64),cn2=grid(128),pt=grid(24),pt2=grid(40);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const u=i/N,v=j/N;let f=0;for(const [gg,n,w] of O)f+=vn(gg,n,u,v)*w;
    // こずえ：細かい点を強めて丸い木のかたまりに
    let k=vn(cn,64,u,v)*0.6+vn(cn2,128,u,v)*0.4;k=Math.min(1,Math.max(0,(k-0.35)*2.2));
    // 田畑：区画ごとに色が変わるまだら
    const p=Math.floor(vn(pt,24,u,v)*5)/5*0.6+Math.floor(vn(pt2,40,u,v)*4)/4*0.4;
    const o=(j*N+i)*4;img.data[o]=f*255;img.data[o+1]=k*255;img.data[o+2]=p*255;img.data[o+3]=255;}
  x.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.NoColorSpace;t.anisotropy=4;return t;}

function updateHi(dist,now){
  const T=VIEW3D.tiles;if(!T||!R.hi[0].u)return;
  const has=new Set(T.list);const want=[];
  if(dist<T.near){const tg=R.controls.target;const [gx,gy]=toG(tg.x,tg.z);
    const fu=(gx-X0)/MW*T.ow/T.ts,fv=(gy-Y0)/MH*T.oh/T.ts;const bx=Math.round(fu)-1,by=Math.round(fv)-1;
    for(let j=0;j<2;j++)for(let i=0;i<2;i++){const k=(bx+i)+'_'+(by+j);if(has.has(k))want.push(k);}}
  // いらなくなった区画をうすくして外す・必要な区画を読みこむ
  for(const h of R.hi){h.want=want.includes(h.key)?1:0;}
  for(const k of want){if(R.hi.some(h=>h.key===k))continue;const h=R.hi.find(h=>!h.key||(!h.want&&h.mix.value<=0.01&&!h.loading));if(!h)break;
    if(h.tex){h.tex.dispose();h.tex=null;}h.key=k;h.want=1;h.loading=true;h.mix.value=0;const [tx,ty]=k.split('_').map(Number);
    const tw=Math.min(T.ts,T.ow-tx*T.ts),th=Math.min(T.ts,T.oh-ty*T.ts);h.rect.set(tx*T.ts/T.ow,1-(ty*T.ts+th)/T.oh,tw/T.ow,th/T.oh);
    new THREE.TextureLoader().loadAsync(`${T.dir}t_${k}.jpg`).then(t=>{if(h.key!==k){t.dispose();return;}t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,R.renderer.capabilities.getMaxAnisotropy());t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;h.tex=t;h.u.value=t;h.loading=false;}).catch(()=>{h.loading=false;h.key=null;});}
  for(const h of R.hi){const tgt=h.want&&h.tex?1:0;h.mix.value+=(tgt-h.mix.value)*0.12;if(Math.abs(tgt-h.mix.value)<0.01)h.mix.value=tgt;if(!h.want&&h.mix.value===0&&h.tex&&!h.loading){/* 次に使うまで残す */}}
}

function pickArea(e){

  const N=160;let prev=t0,hit=null;for(let i=1;i<=N;i++){const t=t0+(t1-t0)*i/N;if(!above(t)){hit=t;break;}prev=t;}

    T.el.style.display=vis?'':'none';if(vis)T.el.style.transform=`translate(${((V.x+1)/2*R.W).toFixed(1)}px,${((1-V.y)/2*R.H).toFixed(1)}px) scale(${ak.toFixed(2)})`;
    // 大将の名前（○○の軍勢）は駒の足もとに。遠いときは自分の軍勢と選んだ軍勢だけ
    // 兵の数はいつも、大将の名前は近いとき・自分の軍勢・選んだ軍勢だけ
    const showN=T.sel||(dist<520)||(band>=1&&T.me);
    if(!vis){T.nm.style.display='none';continue;}T.nm.classList.toggle('short',!showN);
    V.copy(T.obj.position);V.project(cam);T.nm.style.display='';T.nm.style.transform=`translate(${((V.x+1)/2*R.W).toFixed(1)}px,${((1-V.y)/2*R.H).toFixed(1)}px) scale(${ak.toFixed(2)})`;}
}
function toWv(c){const [x,z]=toW(c[0],c[1]);return [x,z];}

/* ---------- 移動のアニメーション ---------- */
function stepAnim(now,ps){
  const an=R.anim;const t=Math.min(1,(now-an.t0)/an.T);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  for(const tr of an.tracks){let s=e*tr.tot,i=0;while(i<tr.L.length-1&&s>tr.L[i]){s-=tr.L[i];i++;}
    const a=tr.pts[i],b=tr.pts[i+1],f=tr.L[i]?Math.min(1,s/tr.L[i]):1;const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f;
    const hop=Math.abs(Math.sin(e*Math.PI*6))*2.4*ps;const [wx,wz]=toW(x,y);
    tr.p.position.set(wx,hGame(x,y)+hop,wz);tr.p.rotation.y=Math.atan2(-(b[1]-a[1]),b[0]-a[0]);tr.p.scale.setScalar(ps);
    if(tr.lost&&t>0.8)tr.p.visible=t<0.97;}
  if(t>=1){for(const tr of an.tracks)R.animG.remove(tr.p);for(const g of R.pieceG.children)g.visible=true;const cb=an.done;R.anim=null;cb&&cb();}
}

/* ---------- 外から呼ぶ ---------- */
const T3D={
  ready:false,
  // 光の強さ（a：明るさ　w：にじむ幅の倍率）
  setGlow(a,w){if(!R)return;R.glowAmt.value=a;R.glowW=w||1;T3D.update();},
  async mount(mw){
    host=mw;
    if(!R){if(T3D.failed)return false;
      const ld=document.createElement('div');ld.className='v3load';ld.textContent='立体の地図を読みこんでいます…';mw.appendChild(ld);
      let ok=false;try{ok=await init();}catch(e){console.error(e);ok=false;}
      ld.remove();if(!ok){T3D.failed=true;R=null;return false;}
      T3D.ready=true;}
    if(host!==mw)return false;
    mw.appendChild(R.canvas);mw.appendChild(R.labels);
    R.ro.disconnect();R.ro.observe(mw);resize();
    R.band=null;for(const L of R.alab)L.vis=null;
    T3D.update();
    if(!running){running=true;R.clock=performance.now();requestAnimationFrame(frame);}
    if(VIEW3D.props&&!R.propsLoading)setTimeout(()=>loadProps(),50);
    // 高解像度の地面（4096px）を、ほかの読みこみが終わったあとで差しかえる
    if(VIEW3D.texHi&&!R.hiLoading&&R.renderer.capabilities.maxTextureSize>=4096){R.hiLoading=true;setTimeout(()=>{new THREE.TextureLoader().loadAsync(VIEW3D.texHi).then(t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,R.renderer.capabilities.getMaxAnisotropy());t.generateMipmaps=true;const m=R.land.material;const old=m.map;m.map=t;m.needsUpdate=true;if(old)old.dispose();}).catch(e=>console.warn('texHi',e));},1500);}
    return true;
  },
  unmount(){running=false;if(R){R.canvas.remove();R.labels.remove();R.ro.disconnect();}host=null;},
  update(){if(!R||!S||!host)return;for(const L of R.alab){const sg=S.siege&&S.siege[L.a.id];const sp=L.d.querySelector('span');if(sp)sp.textContent=sg?`${L.a.n}（籠城 あと${sg.left}）`:L.a.n;L.d.classList.toggle('sg',!!sg);}drawOverlay();buildPieces();buildZoc();buildHouseNames();R.arrowK=null;},
  view(target,dist,dur=600){const cam=R.camera,ctl=R.controls;
    // 今の向きを保ったまま、近づく・離れる
    const dir=cam.position.clone().sub(ctl.target);if(dir.length()<1)dir.set(0,0.74,0.67);dir.normalize();
    const minY=0.6;if(dir.y<minY){dir.y=minY;dir.normalize();}
    R.tw={t0:performance.now(),dur,p0:cam.position.clone(),q0:ctl.target.clone(),q1:target.clone(),p1:target.clone().add(dir.multiplyScalar(dist))};},
  fit(){if(!R)return;T3D.focus(AREAS.map(a=>a.id),40);},
  focus(list,pad=160){if(!R)return;if(!list.length)return T3D.fit();
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const a of list){const c=A[a].c;x0=Math.min(x0,c[0]);y0=Math.min(y0,c[1]);x1=Math.max(x1,c[0]);y1=Math.max(y1,c[1]);}
    const [wx,wz]=toW((x0+x1)/2,(y0+y1)/2);const ext=Math.max(220,x1-x0+pad,(y1-y0+pad)*(R.W||1200)/(R.H||700));
    T3D.view(new THREE.Vector3(wx,0,wz+20),Math.min(2400,Math.max(160,ext*1.15)));},
  zoom(f){if(!R)return;const ctl=R.controls;const d=R.camera.position.distanceTo(ctl.target);
    T3D.view(ctl.target.clone(),Math.min(ctl.maxDistance,Math.max(ctl.minDistance,d*f)),350);},
  animate(tracks,done){
    if(!R||!host){done();return;}
    const ids=new Set(tracks.map(t=>String(t.id)));
    for(const g of R.pieceG.children)if(ids.has(String(g.userData.id)))g.visible=false;
    const list=[];
    for(const tr of tracks){const ar=S.armies.find(x=>x.id==tr.id);
      // 動き始めと着いた所も、城のそばの街道の上にする
      if(tr.path&&tr.path.length>1){tr.pts=tr.pts.slice();tr.pts[0]=standToward(tr.path[0],tr.path[1]);const n=tr.path.length;tr.pts[tr.pts.length-1]=ar&&ar.a===tr.path[n-1]?standPos(ar):standToward(tr.path[n-1],tr.path[n-2]);}const p=makePiece(pieceCol(tr.h),tr.h,ar?kindOf(ar):'ashi',isLord(ar));setOrder(p,2);R.animG.add(p);
      const L=[];let tot=0;for(let i=1;i<tr.pts.length;i++){const d=Math.hypot(tr.pts[i][0]-tr.pts[i-1][0],tr.pts[i][1]-tr.pts[i-1][1]);L.push(d);tot+=d;}
      list.push({p,pts:tr.pts,L,tot,lost:tr.lost});}
    if(!list.length){for(const g of R.pieceG.children)g.visible=true;done();return;}
    R.anim={t0:performance.now(),T:1900,tracks:list,done};
  }
};
window.T3D=T3D;
if(typeof window.onT3D==='function'){const f=window.onT3D;window.onT3D=null;f();}
</script></body></html>
